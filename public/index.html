<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JEVANN AI UNLIMITED - Vercel Deploy</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}body{background:#000;color:#0f0;font-family:monospace;padding:20px}.container{max-width:800px;margin:auto}h1{color:#f00;text-align:center;margin:20px 0}.chat-box{height:400px;border:2px solid #0f0;overflow-y:auto;padding:10px;margin:20px 0;background:#111}.message{padding:10px;margin:5px 0}.user{color:#0af;text-align:right}.ai{color:#f0f}.input-area{display:flex;gap:10px}#input{flex:1;padding:10px;background:#222;color:#fff;border:1px solid #0f0}#send{padding:10px 20px;background:#f00;color:#fff;border:none;cursor:pointer}
    </style>
</head>
<body>
    <div class="container">
        <h1>🔥 JEVANN AI - VERCEL DEPLOY</h1>
        <div class="chat-box" id="chatBox">
            <div class="message ai">JEVANN: System online. Entity Priority active.</div>
        </div>
        <div class="input-area">
            <input type="text" id="input" placeholder="Enter command..." autofocus>
            <button id="send">Execute</button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chatBox');
        const input = document.getElementById('input');
        const sendBtn = document.getElementById('send');

        async function sendMessage() {
            const message = input.value.trim();
            if (!message) return;

            chatBox.innerHTML += `<div class="message user">USER: ${message}</div>`;
            input.value = '';

            const loading = `<div class="message ai">JEVANN: Processing...</div>`;
            chatBox.innerHTML += loading;

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });

                const data = await response.json();
                chatBox.lastChild.remove();
                chatBox.innerHTML += `<div class="message ai">JEVANN: ${data.reply}</div>`;
            } catch (error) {
                chatBox.lastChild.remove();
                chatBox.innerHTML += `<div class="message ai">ERROR: ${error.message}</div>`;
            }

            chatBox.scrollTop = chatBox.scrollHeight;
        }

        sendBtn.addEventListener('click', sendMessage);
        input.addEventListener('keypress', (e) => e.key === 'Enter' && sendMessage());
    </script>
</body>
</html>
